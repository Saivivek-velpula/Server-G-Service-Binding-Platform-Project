<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | ServerG</title>
  <meta name="description" content="Create a ServerG customer or provider account. Join the local service marketplace today.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ==========================================
       HEADER & NAVIGATION BAR
       ========================================== -->
  <header class="header">
    <div class="container navbar">
      <a href="index.html" class="logo">
        <i data-lucide="wrench"></i>
        <span>ServerG</span>
      </a>
      
      <nav class="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="services.html" class="nav-link">Find Services</a>
        <a href="customer-dashboard.html" class="nav-link">My Bookings</a>
        <a href="provider-dashboard.html" class="nav-link">Provider Center</a>
      </nav>
      
      <div class="nav-actions">
        <a href="login.html" class="btn btn-secondary btn-sm">Login</a>
      </div>
    </div>
  </header>

  <!-- ==========================================
       REGISTER CARD LAYOUT
       ========================================== -->
  <main class="auth-wrapper">
    <div class="auth-container" style="max-width: 550px;">
      <div class="auth-card">
        <div class="auth-header">
          <h2>Create Account</h2>
          <p>Join ServerG to request services or work as a local provider.</p>
        </div>
        
        <form id="register-form" class="auth-form" novalidate>
          
          <!-- Role Selection Custom Pills Toggles -->
          <div class="role-selector-group mb-4">
            <span class="form-label" style="display: block; text-align: center; margin-bottom: 0.75rem;">I want to join as a:</span>
            <div class="role-pills">
              <label class="role-pill-option">
                <input type="radio" name="register-role" value="customer" checked>
                <div class="role-pill-box">
                  <i data-lucide="user"></i>
                  <span>Customer</span>
                </div>
              </label>
              <label class="role-pill-option">
                <input type="radio" name="register-role" value="provider">
                <div class="role-pill-box">
                  <i data-lucide="briefcase"></i>
                  <span>Service Provider</span>
                </div>
              </label>
            </div>
          </div>
          
          <!-- Full Name -->
          <div class="form-group mb-3">
            <label for="reg-name" class="form-label">Full Name</label>
            <div class="filter-input-wrapper">
              <i data-lucide="user" class="filter-input-icon"></i>
              <input type="text" id="reg-name" class="filter-control" placeholder="John Doe" required>
            </div>
            <div class="error-msg" id="name-error"></div>
          </div>

          <!-- Email Address -->
          <div class="form-group mb-3">
            <label for="reg-email" class="form-label">Email Address</label>
            <div class="filter-input-wrapper">
              <i data-lucide="mail" class="filter-input-icon"></i>
              <input type="email" id="reg-email" class="filter-control" placeholder="john@example.com" required>
            </div>
            <div class="error-msg" id="email-error"></div>
          </div>

          <!-- Phone Number -->
          <div class="form-group mb-3">
            <label for="reg-phone" class="form-label">Phone Number</label>
            <div class="filter-input-wrapper">
              <i data-lucide="phone" class="filter-input-icon"></i>
              <input type="tel" id="reg-phone" class="filter-control" placeholder="10-digit mobile number" required>
            </div>
            <div class="error-msg" id="phone-error"></div>
          </div>

          <!-- Password -->
          <div class="form-group mb-3">
            <label for="reg-password" class="form-label">Password</label>
            <div class="filter-input-wrapper">
              <i data-lucide="lock" class="filter-input-icon"></i>
              <input type="password" id="reg-password" class="filter-control" placeholder="Minimum 6 characters" required>
            </div>
            <div class="error-msg" id="password-error"></div>
          </div>

          <!-- Confirm Password -->
          <div class="form-group mb-4">
            <label for="reg-confirm" class="form-label">Confirm Password</label>
            <div class="filter-input-wrapper">
              <i data-lucide="lock" class="filter-input-icon"></i>
              <input type="password" id="reg-confirm" class="filter-control" placeholder="Re-enter password" required>
            </div>
            <div class="error-msg" id="confirm-error"></div>
          </div>
          
          <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">
            Register Account
          </button>
        </form>
        
        <div class="auth-footer text-center" style="margin-top: 2rem; font-size: 0.9rem; color: var(--slate-500);">
          Already have an account? <a href="login.html" class="text-primary" style="font-weight: 600;">Log In</a>
        </div>
      </div>
    </div>
  </main>

  <!-- ==========================================
       FOOTER
       ========================================== -->
  <footer class="footer">
    <div class="container footer-bottom" style="border-top: none; padding-top: 0; justify-content: center;">
      <div>&copy; 2026 ServerG. All rights reserved. Portfolio Marketplace.</div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
  <script>
    if (typeof lucide !== "undefined") {
      lucide.createIcons();
    }
  </script>
</body>
</html>
